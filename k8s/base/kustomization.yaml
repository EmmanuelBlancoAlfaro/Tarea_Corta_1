apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - configmap.yaml
  - secret.yaml
  - postgres-pvc.yaml
  - postgres-deploy.yaml
  - keycloak-deploy.yaml
  - app-deploy.yaml

configMapGenerator:
  - name: db-init-configmap
    files:
      - init.sql=init.sql
  - name: keycloak-realm-configmap
    files:
      - realm-export.json=realm-export.json
