apiVersion: apps/v1
kind: Deployment
metadata:
    name: postgres
spec:
    replicas: 1
    selector:
        matchLabels:
            app: postgres
    template:
        metadata:
            labels:
                app: postgres
        spec:
            containers:
                - name: postgres
                  image: postgres:15-alpine
                  ports:
                    - containerPort: 5432
                  envFrom:
                    - configMapRef:
                        name: app-config
                    - secretRef:
                        name: app-secrets
                  readinessProbe:
                    exec:
                        command: ["pg_isready", "-U", "$(DB_USER)", "-d", "$(DB_NAME)"]
                    intervalSeconds: 5
                    timeoutSeconds: 5
                    failureThreshold: 5
                  volumeMounts:
                    - name: pgdata
                      mountPath: /var/lib/postgresql/data
                    - name: init-script
                      mountPath: /docker-entrypoint-initdb.d/init.sql
                      subPath: init.sql
            volumes:
                - name: pgdata
                  persistentVolumeClaim:
                    claimName: pgdata-pvc
                - name: init-script
                  configMap:
                    name: db-init-configmap
---
apiVersion: v1
kind: Service
metadata:
    name: postgres
spec:
    type: NodePort
    selector:
        app: postgres
    ports:
        - port: 5432
          targetPort: 5432
          nodePort: 30432